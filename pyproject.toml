[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradera-indexer"
version = "0.1.0"
description = "Index and search Tradera listings, and publish new listings via the Tradera API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["tradera", "indexer", "search", "marketplace", "sweden"]
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
soap = [
    "zeep>=4.2.1",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5.0",
]

[project.scripts]
tradera-indexer = "tradera_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tradera_indexer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
